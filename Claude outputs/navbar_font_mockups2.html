<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WorthKeeping — sidebar font options v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;1,500&family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600&family=Oswald:wght@400;500;600;700&family=Bebas+Neue&family=Comfortaa:wght@500;600;700&family=Archivo:wght@400;500;600;700&family=Courier+Prime:wght@400;700&family=Caveat:wght@500;600;700&family=Bricolage+Grotesque:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #EFE9DC;
    padding: 2.5rem;
    font-family: 'DM Sans', sans-serif;
  }
  h1 {
    font-family: 'Spectral', serif;
    font-style: italic;
    font-size: 1.7rem;
    color: #1C1408;
    margin-bottom: 0.3rem;
  }
  p.sub {
    color: #75664C;
    font-size: 0.85rem;
    margin-bottom: 2rem;
    max-width: 640px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 1.5rem;
  }
  .cell {
    background: #fff;
    border: 1px solid rgba(90,70,20,0.16);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(60,45,15,0.08);
  }
  .cell-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #FAF6EE;
    background: #1C1408;
    padding: 0.5rem 0.9rem;
  }
  .sidebar {
    background: #FFFCF5;
    padding: 1.1rem 1.1rem 1.3rem;
  }
  .logo-row { display: flex; align-items: center; gap: 0.3rem; justify-content: center; margin-bottom: 0.15rem; }
  .logo-icon { width: 26px; height: 26px; color: #1C1408; flex-shrink: 0; }
  .logo-icon svg { width: 100%; height: 100%; }
  .logo-text { font-family: 'Spectral', serif; font-style: italic; font-size: 1.1rem; font-weight: 500; color: #1C1408; }
  .logo-text .accent { font-style: normal; color: #7A5C10; }
  .tagline { text-align: center; font-size: 0.56rem; letter-spacing: 0.03em; color: #75664C; margin-bottom: 0.9rem; }
  .search {
    display: flex; gap: 0.3rem; margin-bottom: 1rem;
  }
  .search input {
    flex: 1; padding: 0.35rem 0.55rem; border: 1.5px solid rgba(90,70,20,0.24); border-radius: 8px;
    background: #FAF6EE; font-size: 0.7rem; color: #75664C;
  }
  .search button {
    padding: 0.35rem 0.5rem; border: none; border-radius: 8px; background: #D4AF6A; font-size: 0.65rem;
  }
  .section-label {
    font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    color: #75664C; margin-bottom: 0.45rem;
  }
  .nav-link {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.4rem 0.5rem; border-radius: 8px;
    font-size: 0.8rem; font-weight: 500; color: #4A3F2A;
    margin-bottom: 2px;
  }
  .nav-link svg { width: 14px; height: 14px; opacity: 0.65; flex-shrink: 0; }
  .nav-link.active { background: #FAF6EE; color: #1C1408; font-weight: 600; box-shadow: 0 1px 3px rgba(60,45,15,0.14); }
  .nav-link.active svg { opacity: 1; }
</style>
</head>
<body>

<h1>Sidebar font options — round 2</h1>
<p class="sub">Ten genuinely different typeface characters this time (mono, condensed display, serif, rounded, handwritten, grotesk) instead of near-identical geometric sans fonts. Logo stays Spectral italic.</p>

<div class="grid" id="grid"></div>

<script>
const fonts = [
  { name: "IBM Plex Mono", css: "'IBM Plex Mono', monospace", upper: false },
  { name: "Space Grotesk", css: "'Space Grotesk', sans-serif", upper: false },
  { name: "Fraunces (serif)", css: "'Fraunces', serif", upper: false },
  { name: "Oswald (condensed)", css: "'Oswald', sans-serif", upper: true },
  { name: "Bebas Neue (display)", css: "'Bebas Neue', sans-serif", upper: true },
  { name: "Comfortaa (rounded)", css: "'Comfortaa', sans-serif", upper: false },
  { name: "Archivo (grotesk)", css: "'Archivo', sans-serif", upper: false },
  { name: "Courier Prime (typewriter)", css: "'Courier Prime', monospace", upper: false },
  { name: "Caveat (handwritten)", css: "'Caveat', cursive", upper: false },
  { name: "Bricolage Grotesque", css: "'Bricolage Grotesque', sans-serif", upper: false },
];

const navItems = [
  { active: true,  label: "Home",   icon: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>' },
  { active: false, label: "Friends", icon: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>' },
  { active: false, label: "Notifications", icon: '<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>' },
  { active: false, label: "Search", icon: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>' },
];

const grid = document.getElementById("grid");

fonts.forEach(font => {
  const cell = document.createElement("div");
  cell.className = "cell";
  const tt = font.upper ? "text-transform:uppercase; letter-spacing:0.03em;" : "";
  cell.innerHTML = `
    <div class="cell-label">${font.name}</div>
    <div class="sidebar" style="font-family:${font.css};">
      <div class="logo-row">
        <div class="logo-icon"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11 L20 32"/><path d="M20 11 C 16.5 8.7 11 8 6 9.4 L6.8 27.5 C 11.5 26.2 16.5 27 20 29.3"/><path d="M20 11 C 23.5 8.7 29 8 34 9.4 L33.2 27.5 C 28.5 26.2 23.5 27 20 29.3"/></svg></div>
        <span class="logo-text" style="font-family:'Spectral',serif;">Worth<span class="accent">Keeping</span></span>
      </div>
      <div class="tagline" style="${tt}">for the memories worth keeping</div>
      <div class="search">
        <input type="text" placeholder="Search memories…" readonly>
        <button>🔍</button>
      </div>
      <div class="section-label" style="${tt}">Navigation</div>
      ${navItems.map(item => `
        <div class="nav-link ${item.active ? 'active' : ''}" style="${tt}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${item.icon}</svg>
          ${item.label}
        </div>
      `).join("")}
    </div>
  `;
  grid.appendChild(cell);
});
</script>

</body>
</html>
