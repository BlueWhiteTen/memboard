<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorthKeeping – Offline</title>
<style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{
        font-family:'Spectral',Georgia,serif; background:#EAE2CD; color:#241F18;
        min-height:100vh; display:flex; align-items:center; justify-content:center;
        padding:2rem 1.5rem; text-align:center;
    }
    @media (prefers-color-scheme: dark) {
        body{ background:#0C0F1C; color:#F6E7BD; }
    }
    .wrap{ max-width:380px; }
    .icon{ width:44px; height:44px; margin:0 auto 1.25rem; color:#8C6A2F; }
    h1{ font-style:italic; font-weight:500; font-size:1.5rem; margin-bottom:0.75rem; }
    p{ font-size:0.9rem; opacity:0.75; line-height:1.5; margin-bottom:1.5rem; }
    button{
        font-family:inherit; font-size:0.85rem; font-weight:600; cursor:pointer;
        background:#8C6A2F; color:#FAF6EA; border:1.5px solid #8C6A2F;
        padding:0.6rem 1.4rem;
    }
    button:hover{ filter:brightness(1.08); }
</style>
</head>
<body>
<div class="wrap">
    <svg class="icon" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
        <rect x="7" y="9" width="26" height="22" rx="0.6"/>
        <path d="M7 15h26"/>
        <path d="M14 20h5v5h-5zM21 15h6v9h-6zM7 24h6v7h-6z"/>
        <rect x="14" y="20" width="5" height="5" fill="currentColor" stroke="none" opacity="0.85"/>
    </svg>
    <h1>You're offline</h1>
    <p>WorthKeeping can't reach the internet right now. Anything you already had open should still work — reconnect to see new memories.</p>
    <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
