<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Check your email – Memboard</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}:root{--cream:#EAE2CD;--warm-white:#FAF6EA;--ink:#241F18;--ink-light:#3A2F1C;--amber:#8C6A2F;--border:rgba(23,23,26,0.16);--border-strong:#241F18;--coral:#B14A3A;--yellow:#D4AF6A;}body{font-family:'Spectral', serif;background:var(--cream);min-height:100vh;display:flex;align-items:center;justify-content:center;}.wrap{max-width:420px;width:100%;padding:1.5rem;text-align:center;}.card{background:var(--warm-white);border:2.5px solid var(--border-strong);border-radius:0;padding:2.5rem;}.icon{font-size:3rem;margin-bottom:1rem;}h2{font-family:'Spectral', serif;font-size:1.3rem;font-weight:600;color:var(--ink);margin-bottom:0.5rem;}p{font-size:0.875rem;color:var(--ink-light);line-height:1.6;}a{color:var(--amber);text-decoration:none;display:inline-block;margin-top:1.5rem;font-size:0.875rem;}</style></head>
<body><div class="wrap"><div class="card"><div class="icon">📧</div><h2>Check your email</h2><p>We've sent a password reset link to your email address. Click the link in the email to set a new password.<br><br>The link expires in 24 hours.</p><a href="{% url 'login' %}">← Back to sign in</a></div></div></body></html>
