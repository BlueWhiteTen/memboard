{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Reset Password – Rememory" %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        :root{--cream:#EAE2CD;--warm-white:#FAF6EA;--ink:#241F18;--ink-light:#3A2F1C;--amber:#8C6A2F;--amber-pale:#E4D6B0;--border:rgba(23,23,26,0.16);--border-strong:#241F18;--coral:#B14A3A;--yellow:#D4AF6A;}
        body{font-family:'Spectral', serif;background:var(--cream);min-height:100vh;display:flex;align-items:center;justify-content:center;}
        .wrap{width:100%;max-width:420px;padding:1.5rem;}
        .logo-area{text-align:center;margin-bottom:2rem;}
        .logo-area h1{font-family:'Spectral', serif;font-size:1.7rem;font-weight:600;color:var(--ink);}
        .logo-area p{font-size:0.875rem;color:var(--ink-light);margin-top:0.3rem;}
        .card{background:var(--warm-white);border:2.5px solid var(--border-strong);border-radius:0;padding:2rem;box-shadow:4px 4px 0 var(--ink);}
        .card h2{font-family:'Spectral', serif;font-size:1.15rem;font-weight:600;color:var(--ink);margin-bottom:0.5rem;}
        .card p{font-size:0.875rem;color:var(--ink-light);margin-bottom:1.5rem;}
        .field{margin-bottom:1rem;}
        .field label{display:block;font-size:0.78rem;font-weight:500;color:var(--ink-light);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.4rem;}
        .field input{width:100%;height:44px;border:2px solid var(--border-strong);border-radius:0;padding:0 0.9rem;font-family:'Spectral', serif;font-size:0.95rem;color:var(--ink);background:var(--cream);outline:none;}
        .field input:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(42,75,155,0.18);}
        .btn{width:100%;height:46px;background:var(--ink);color:var(--warm-white);border:none;border-radius:0;font-family:'Spectral', serif;font-size:0.95rem;font-weight:500;cursor:pointer;transition:background 0.15s;margin-top:0.5rem;}
        .btn:hover{background:var(--ink-light);}
        .footer-link{text-align:center;margin-top:1.25rem;font-size:0.875rem;color:var(--ink-light);}
        .footer-link a{color:var(--amber);text-decoration:none;font-weight:500;}
    </style>
</head>
<body>
<div class="wrap">
    <div class="logo-area">
        <h1>{% trans "Rememory" %}</h1>
        <p>{% trans "Reset your password" %}</p>
    </div>
    <div class="card">
        <h2>{% trans "Forgot your password?" %}</h2>
        <p>{% trans "Enter your email address and we'll send you a link to reset it." %}</p>
        <form method="post">
            {% csrf_token %}
            <div class="field">
                <label for="id_email">{% trans "Email address" %}</label>
                <input type="email" id="id_email" name="email" placeholder="{% trans 'your@email.com' %}" autocomplete="email">
            </div>
            <button type="submit" class="btn">{% trans "Send reset link" %}</button>
        </form>
        <div class="footer-link"><a href="{% url 'login' %}">{% trans "← Back to sign in" %}</a></div>
    </div>
</div>
</body>
</html>
