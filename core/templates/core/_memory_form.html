{% load i18n %}
<style>
.form-group { margin-bottom: 1rem; }
.form-label { display:block; font-size:0.8rem; font-weight:500; color:var(--ink-muted); margin-bottom:0.35rem; }
.form-input {
    width:100%; padding:0.5rem 0.75rem;
    border:1px solid var(--border); border-radius:0;
    font-family:inherit; font-size:0.875rem; color:var(--ink);
    background:var(--cream); outline:none; transition:border-color 0.12s;
}
.form-input:focus { border-color:var(--amber); }
textarea.form-input { resize:vertical; min-height:80px; }
.colour-picker { display:flex; gap:0.4rem; flex-wrap:wrap; }
.colour-swatch {
    width:30px; height:30px; border-radius:50%;
    border:3px solid transparent; cursor:pointer; transition:border-color 0.12s;
}
.colour-swatch.selected { border-color: var(--ink); }
.colour-swatch.c-yellow   { background:var(--note-yellow); }
.colour-swatch.c-green    { background:var(--note-green); }
.colour-swatch.c-blue     { background:var(--note-blue); }
.colour-swatch.c-pink     { background:var(--note-pink); }
.colour-swatch.c-lavender { background:var(--note-lavender); }
.colour-swatch.c-peach    { background:var(--note-peach); }
.tag-checkboxes { display:flex; flex-wrap:wrap; gap:0.4rem; }
.tag-check { display:none; }
.tag-label { display:inline-flex; align-items:center; gap:0.3rem; padding:0.25rem 0.7rem; border-radius:0; border:1px solid var(--border); font-size:0.78rem; cursor:pointer; transition:all 0.12s; }
.tag-check:checked + .tag-label { background:var(--amber); color:white; border-color:var(--amber); }
.perm-btns { display:flex; gap:0.4rem; flex-wrap:wrap; }
.perm-radio { display:none; }
.perm-label { display:inline-block; padding:0.25rem 0.75rem; border-radius:0; border:1px solid var(--border); font-size:0.78rem; cursor:pointer; }
.perm-radio:checked + .perm-label { background:var(--ink); color:var(--warm-white); border-color:var(--ink); }
</style>

<input type="hidden" name="colour" id="{{ prefix }}-colour-field" value="{{ memory.colour|default:'yellow' }}">
<input type="hidden" name="edit_permission" id="{{ prefix }}-perm-field" value="{{ memory.edit_permission|default:'only_me' }}">

<div class="form-group">
    <label class="form-label">Title (optional)</label>
    <input type="text" name="title" class="form-input" placeholder="Give this memory a name…" value="{{ memory.title|default:'' }}">
</div>
<div class="form-group">
    <label class="form-label">Memory *</label>
    <textarea name="content" class="form-input" rows="4" placeholder="Write your memory here…" required>{{ memory.content|default:'' }}</textarea>
</div>

<div class="form-group">
    <label class="form-label">📅 When did this happen?</label>
    <input type="date" name="memory_date" class="form-input" value="{{ memory.memory_date|date:'Y-m-d'|default:'' }}"
           min="1900-01-01" max="2099-12-31">
</div>

<div class="form-group">
    <label class="form-label">📍 Location</label>
    <input type="text" name="location_name" class="form-input" placeholder="Add a place…"
           id="{{ prefix }}-location-name-input" value="{{ memory.location_name|default:'' }}"
           oninput="onMemoryLocationInput('{{ prefix }}')">
    <input type="hidden" name="location_lat" id="{{ prefix }}-location-lat" value="{{ memory.location_lat|default:'' }}">
    <input type="hidden" name="location_lng" id="{{ prefix }}-location-lng" value="{{ memory.location_lng|default:'' }}">
    <div id="{{ prefix }}-location-suggestions" style="font-size:0.78rem;color:var(--ink-muted);margin-top:0.25rem;"></div>
</div>

<div class="form-group">
    <label class="form-label">🖼 Photo</label>
    {% if memory.photo %}
    <div style="margin-bottom:0.4rem;font-size:0.78rem;color:var(--ink-muted);">Current: <a href="{{ memory.photo.url }}" target="_blank" rel="noopener">view photo</a> — choose a new file to replace it.</div>
    {% endif %}
    <input type="file" name="photo" class="form-input" accept="image/*" style="padding:0.35rem;">
</div>

<div class="form-group">
    <label class="form-label">🎨 Colour</label>
    <div class="colour-picker">
        <span class="colour-swatch c-yellow {% if memory.colour|default:'yellow' == 'yellow' %}selected{% endif %}" onclick="setMemoryColour('{{ prefix }}','yellow',this)" title="Yellow"></span>
        <span class="colour-swatch c-green {% if memory.colour == 'green' %}selected{% endif %}"    onclick="setMemoryColour('{{ prefix }}','green',this)"    title="Green"></span>
        <span class="colour-swatch c-blue {% if memory.colour == 'blue' %}selected{% endif %}"     onclick="setMemoryColour('{{ prefix }}','blue',this)"     title="Blue"></span>
        <span class="colour-swatch c-pink {% if memory.colour == 'pink' %}selected{% endif %}"     onclick="setMemoryColour('{{ prefix }}','pink',this)"     title="Pink"></span>
        <span class="colour-swatch c-lavender {% if memory.colour == 'lavender' %}selected{% endif %}" onclick="setMemoryColour('{{ prefix }}','lavender',this)" title="Lavender"></span>
        <span class="colour-swatch c-peach {% if memory.colour == 'peach' %}selected{% endif %}"    onclick="setMemoryColour('{{ prefix }}','peach',this)"    title="Peach"></span>
    </div>
</div>

<div class="form-group">
    <label class="form-label">👥 Tag people</label>
    <div class="tag-checkboxes">
        {% for member in all_members %}
        {% if member != request.user %}
        <input type="checkbox" name="tagged" value="{{ member.pk }}" id="{{ prefix }}-tag-{{ member.pk }}" class="tag-check"
               {% if tagged_ids and member.pk in tagged_ids %}checked{% endif %}>
        <label for="{{ prefix }}-tag-{{ member.pk }}" class="tag-label">{{ member.initials }}</label>
        {% endif %}
        {% endfor %}
    </div>
</div>

<div class="form-group">
    <label class="form-label">✏️ Who can edit?</label>
    <div class="perm-btns">
        <input type="radio" name="edit_permission_r" value="only_me"     id="{{ prefix }}-p1" class="perm-radio"
               {% if memory.edit_permission|default:'only_me' == 'only_me' %}checked{% endif %} onchange="setMemoryPerm('{{ prefix }}','only_me')">
        <label for="{{ prefix }}-p1" class="perm-label">Only me</label>
        <input type="radio" name="edit_permission_r" value="tagged"      id="{{ prefix }}-p2" class="perm-radio"
               {% if memory.edit_permission == 'tagged' %}checked{% endif %} onchange="setMemoryPerm('{{ prefix }}','tagged')">
        <label for="{{ prefix }}-p2" class="perm-label">Me & tagged</label>
        <input type="radio" name="edit_permission_r" value="all_members" id="{{ prefix }}-p3" class="perm-radio"
               {% if memory.edit_permission == 'all_members' %}checked{% endif %} onchange="setMemoryPerm('{{ prefix }}','all_members')">
        <label for="{{ prefix }}-p3" class="perm-label">All members</label>
    </div>
</div>

<script>
// Shared by every instance of this partial (Add Memory modal, Edit Memory
// modal). Each instance's elements are ID-scoped by {{ prefix }}, and every
// function below takes that prefix as its first argument rather than baking
// it into the function body — so redefining these on a second inclusion
// (e.g. when the Edit modal's fragment is fetched and injected) is harmless:
// both definitions behave identically.
function setMemoryColour(prefix, c, el) {
    document.getElementById(prefix + '-colour-field').value = c;
    el.parentElement.querySelectorAll('.colour-swatch').forEach(s => s.classList.remove('selected'));
    el.classList.add('selected');
}
function setMemoryPerm(prefix, p) { document.getElementById(prefix + '-perm-field').value = p; }

// Location autocomplete using Nominatim
function onMemoryLocationInput(prefix) {
    clearTimeout(window['_locTimer_' + prefix]);
    const input = document.getElementById(prefix + '-location-name-input');
    const sug   = document.getElementById(prefix + '-location-suggestions');
    const q = input.value.trim();
    if (q.length < 3) { sug.innerHTML = ''; return; }
    window['_locTimer_' + prefix] = setTimeout(() => {
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=3`)
        .then(r => r.json()).then(results => {
            sug.innerHTML = results.map(r =>
                `<span style="cursor:pointer;margin-right:0.5rem;color:var(--amber);" onclick="selectMemoryLocation('${prefix}','${r.display_name.replace(/'/g,"\\'")}','${r.lat}','${r.lon}')">📍 ${r.display_name.substring(0,50)}</span>`
            ).join('<br>');
        });
    }, 400);
}

function selectMemoryLocation(prefix, name, lat, lng) {
    document.getElementById(prefix + '-location-name-input').value = name.split(',').slice(0,2).join(',').trim();
    document.getElementById(prefix + '-location-lat').value = lat;
    document.getElementById(prefix + '-location-lng').value = lng;
    document.getElementById(prefix + '-location-suggestions').innerHTML = '';
}
</script>
