{% load i18n %}
<!DOCTYPE html><html lang="{{ LANGUAGE_CODE }}"><head><meta charset="UTF-8"><title>{% trans "Password reset – WorthKeeping" %}</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}:root{--cream:#EAE2CD;--warm-white:#FAF6EA;--ink:#241F18;--ink-light:#3A2F1C;--amber:#8C6A2F;--border:rgba(23,23,26,0.16);--border-strong:#241F18;--coral:#B14A3A;--yellow:#D4AF6A;}body{font-family:'Spectral', serif;background:var(--cream);min-height:100vh;display:flex;align-items:center;justify-content:center;}.wrap{max-width:420px;width:100%;padding:1.5rem;text-align:center;}.card{background:var(--warm-white);border:2.5px solid var(--border-strong);border-radius:0;padding:2.5rem;}.icon{font-size:3rem;margin-bottom:1rem;}h2{font-family:'Spectral', serif;font-size:1.3rem;font-weight:600;color:var(--ink);margin-bottom:0.75rem;}p{font-size:0.875rem;color:var(--ink-light);}.btn{display:inline-block;margin-top:1.5rem;padding:0.65rem 1.5rem;background:var(--ink);color:white;border-radius:0;text-decoration:none;font-size:0.9rem;}</style></head>
<body><div class="wrap"><div class="card"><div class="icon">✅</div><h2>{% trans "Password updated!" %}</h2><p>{% trans "Your password has been successfully reset. You can now sign in with your new password." %}</p><a href="{% url 'login' %}" class="btn">{% trans "Sign in" %}</a></div></div></body></html>
