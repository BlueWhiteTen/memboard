<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Password reset – Memboard</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Karla:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}:root{--cream:#EDEAE1;--warm-white:#FFFFFF;--ink:#17171A;--ink-light:#3A3A3D;--amber:#2A4B9B;--border:rgba(23,23,26,0.16);--border-strong:#17171A;--coral:#F0553F;--yellow:#FFC93C;}body{font-family:'Karla',sans-serif;background:var(--cream);min-height:100vh;display:flex;align-items:center;justify-content:center;}.wrap{max-width:420px;width:100%;padding:1.5rem;text-align:center;}.card{background:var(--warm-white);border:2.5px solid var(--border-strong);border-radius:0;padding:2.5rem;}.icon{font-size:3rem;margin-bottom:1rem;}h2{font-family:'Big Shoulders Display',sans-serif;font-size:1.3rem;font-weight:600;color:var(--ink);margin-bottom:0.75rem;}p{font-size:0.875rem;color:var(--ink-light);}.btn{display:inline-block;margin-top:1.5rem;padding:0.65rem 1.5rem;background:var(--ink);color:white;border-radius:0;text-decoration:none;font-size:0.9rem;}</style></head>
<body><div class="wrap"><div class="card"><div class="icon">✅</div><h2>Password updated!</h2><p>Your password has been successfully reset. You can now sign in with your new password.</p><a href="{% url 'login' %}" class="btn">Sign in</a></div></div></body></html>
