<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memboard – Sign in</title>
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Karla:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
        :root{--cream:#EDEAE1;--warm-white:#FFFFFF;--ink:#17171A;--ink-light:#3A3A3D;--amber:#2A4B9B;--amber-pale:#DCEBFF;--coral:#F0553F;--yellow:#FFC93C;--border:rgba(23,23,26,0.16);--border-strong:#17171A;--shadow-ink:4px 4px 0 var(--ink);}
        body{font-family:'Karla',sans-serif;background:var(--cream);min-height:100vh;display:flex;align-items:center;justify-content:center;}
        .wrap{width:100%;max-width:420px;padding:1.5rem;}
        .logo-area{text-align:center;margin-bottom:2.5rem;}
        .logo-icon{width:52px;height:52px;background:var(--ink);border:2px solid var(--border-strong);border-radius:0;display:inline-flex;align-items:center;justify-content:center;margin-bottom:1rem;}
        .logo-icon svg{width:28px;height:28px;}
        .logo-area h1{font-family:'Big Shoulders Display',sans-serif;font-size:2.1rem;font-weight:900;color:var(--amber);letter-spacing:0.01em;text-transform:uppercase;position:relative;display:inline-block;}
        .logo-area h1::after{content:'Memboard';position:absolute;left:2px;top:2px;color:var(--coral);z-index:-1;}
        .logo-area p{font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--ink-light);margin-top:0.5rem;text-transform:uppercase;letter-spacing:0.04em;}
        .card{background:var(--warm-white);border:2.5px solid var(--border-strong);border-radius:0;padding:2rem;box-shadow:var(--shadow-ink);}
        .card h2{font-family:'Big Shoulders Display',sans-serif;font-size:1.4rem;font-weight:800;text-transform:uppercase;color:var(--ink);margin-bottom:1.5rem;}
        .field{margin-bottom:1rem;}
        .field label{display:block;font-family:'JetBrains Mono',monospace;font-size:0.7rem;font-weight:700;color:var(--ink-light);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:0.4rem;}
        .field input{width:100%;height:44px;border:2px solid var(--border-strong);border-radius:0;padding:0 0.9rem;font-family:'Karla',sans-serif;font-size:0.95rem;color:var(--ink);background:var(--cream);outline:none;transition:border-color 0.15s,box-shadow 0.15s;}
        .field input:focus{border-color:var(--amber);box-shadow:2px 2px 0 var(--amber);}
        .field input::placeholder{color:rgba(58,58,61,0.4);}
        .error-msg{background:#FFE3DE;border:2px solid var(--coral);border-radius:0;padding:0.6rem 0.9rem;margin-bottom:1rem;color:#7A2418;font-size:0.875rem;font-weight:600;}
        .btn{width:100%;height:46px;background:var(--ink);color:var(--warm-white);border:2px solid var(--border-strong);border-radius:0;font-family:'JetBrains Mono',sans-serif;font-size:0.85rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;cursor:pointer;box-shadow:var(--shadow-ink);transition:transform 0.08s,box-shadow 0.08s;margin-top:0.5rem;}
        .btn:hover{background:var(--ink-light);}
        .btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);}
        .footer-link{text-align:center;margin-top:1.25rem;font-size:0.875rem;color:var(--ink-light);}
        .footer-link a{color:var(--amber);text-decoration:none;font-weight:700;}
        .footer-link a:hover{text-decoration:underline;}
    </style>
</head>
<body>
<div class="wrap">
    <div class="logo-area">
        <div class="logo-icon">
            <svg viewBox="0 0 28 28" fill="none">
                <rect x="4" y="6" width="14" height="17" rx="0" fill="#EDEAE1" opacity="0.9"/>
                <rect x="10" y="4" width="14" height="17" rx="0" fill="#EDEAE1" opacity="0.6"/>
                <rect x="5" y="7" width="12" height="2" rx="0" fill="#FFC93C"/>
                <rect x="5" y="11" width="9" height="1.5" rx="0" fill="#FFC93C" opacity="0.7"/>
                <rect x="5" y="14" width="11" height="1.5" rx="0" fill="#FFC93C" opacity="0.7"/>
            </svg>
        </div>
        <h1>Memboard</h1>
        <p>Your shared memory space</p>
    </div>
    <div class="card">
        <h2>Welcome back</h2>
        {% if rate_limited %}
        <div class="error-msg">Too many login attempts from your network. Please wait a few minutes and try again.</div>
        {% elif form.non_field_errors %}
        <div class="error-msg">{{ form.non_field_errors.0 }}</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="field">
                <label for="id_email">Email address</label>
                <input type="email" id="id_email" name="email" placeholder="your@email.com"
                       value="{{ form.email.value|default:'' }}" autocomplete="email">
            </div>
            <div class="field">
                <label for="id_password">Password</label>
                <input type="password" id="id_password" name="password" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" class="btn">Sign in</button>
        </form>
        <div class="footer-link" style="margin-top:0.75rem;">
            <a href="{% url 'password_reset' %}" style="color:var(--ink-muted);font-size:0.82rem;">Forgot password?</a>
        </div>
        <div class="footer-link">New here? <a href="{% url 'register' %}">Create an account</a></div>
    </div>
</div>
</body>
</html>
